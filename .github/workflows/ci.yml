name: CI Pipeline & Quality Gates

on:
  push:
    branches: [ main, master, "telemetry/*", "feature/*", "fix/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality:
    name: Backend Lint, Type-Check & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_bookings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy pytest pytest-asyncio pytest-cov bandit

      - name: Lint with Flake8
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Static Typing Check with Mypy
        run: |
          mypy app --ignore-missing-imports

      - name: Security Vulnerability Scan with Bandit
        run: |
          bandit -r app -ll -ii

      - name: Validate Alembic Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_bookings_test
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
          PUBLIC_API_KEY: ci-test-public-key
        run: |
          alembic upgrade head
          alembic check

      - name: Run Backend Pytest Suite with Coverage
        env:
          DATABASE_URL: sqlite:///:memory:
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
          PUBLIC_API_KEY: ci-test-public-key
          OTEL_SDK_DISABLED: "true"
        run: |
          pytest tests -v --cov=app --cov-report=xml --durations=10

  frontend-quality:
    name: Frontend Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Lint, Type Check, Test and Build
        run: |
          npm run lint
          npm test
          npm run build

  docker-build-check:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dockerfile Build
        run: |
          docker build -t fastapi-bookings:ci .

      - name: Validate Docker Compose Config
        env:
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
          PUBLIC_API_KEY: ci-test-public-key
          POSTGRES_PASSWORD: postgres
        run: |
          docker compose config --quiet
