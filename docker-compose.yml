version: "3.9"

services:
  web:
    build: .
    container_name: fastapi_bookings
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - FRONTEND_ORIGINS=http://localhost:3000,http://localhost:5173
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fastapi_bookings
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=production-secret-key-must-be-configured
      - PUBLIC_API_KEY=production-public-key-must-be-configured
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: fastapi-bookings-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_bookings
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_bookings"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastapi-bookings-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  fastapi-bookings-neo4j:
    image: neo4j:5-community
    container_name: fastapi-bookings-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/bookings_dev_neo4j_password}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - fastapi_bookings_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || cypher-shell -u neo4j -p bookings_dev_neo4j_password 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - default
      - fastapi-bookings-network

volumes:
  postgres_data:
  redis_data:
  fastapi_bookings_neo4j_data:

networks:
  default:
  fastapi-bookings-network:
    name: fastapi-bookings-network